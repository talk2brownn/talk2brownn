# Deploys the website to Cloudflare Pages when site code changes on main, or
# on demand. (The daily price job deploys by itself after publishing data.)
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit).
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch: {}

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build website
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '6345b019449d44c4199ec6b4b96e05d2' }}
        run: npx --yes wrangler@4 pages deploy dist --project-name edge-picks --branch main --commit-dirty=true
