# Runs the engine every morning, publishes the day's price sheet, keeps the
# odds history, and deploys the website to Cloudflare Pages.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   APISPORTS_KEY         your API-Sports key
#   CLOUDFLARE_API_TOKEN  a Cloudflare API token with Cloudflare Pages: Edit
name: Daily prices

on:
  schedule:
    - cron: "17 5 * * *"   # 06:17 Lagos time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine dependencies
        run: pip install "numpy>=1.26" "scipy>=1.11" pytest
      - name: Test engine
        working-directory: engine
        run: python -m pytest -q
      - name: Price today's games
        working-directory: engine
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          TODAY=$(TZ=Africa/Lagos date +%F)
          python -m edge.today --date "$TODAY" --top 0
          python -m edge.export --date "$TODAY" --archive-odds history/odds
      - name: Publish
        run: |
          git config user.name "edge-bot"
          git config user.email "edge-bot@users.noreply.github.com"
          git add web/public/data engine/history
          git commit -m "Daily prices $(TZ=Africa/Lagos date +%F)" || echo "nothing to commit"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build website
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '6345b019449d44c4199ec6b4b96e05d2' }}
        run: npx --yes wrangler@4 pages deploy dist --project-name edge-picks --branch main --commit-dirty=true
